<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VRAFM System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/tokens/variables.css">
    <link rel="stylesheet" href="../css/pages/login.css">
</head>
<body>
    <!-- Hidden Checkbox for CSS-Only Theme Toggle -->
    <input type="checkbox" id="theme-toggle">

    <div class="login-container">
        <!-- Theme Toggle Button -->
        <div class="theme-toggle-wrapper">
            <label for="theme-toggle" class="theme-toggle-label" title="Toggle Light/Dark Mode"></label>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <div class="login-header">
                <h1>VRAFM</h1>
                <p>Welcome back! Please login to your account.</p>
            </div>

            <form action="../index.html" method="GET">
                <div class="mb-3">
                    <label for="email" class="form-label form-label-custom">Email address</label>
                    <input type="email" class="form-control form-control-custom" id="email" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label form-label-custom">Password</label>
                    <input type="password" class="form-control form-control-custom" id="password" placeholder="Enter your password" required>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label form-label-custom" for="rememberMe">Remember me</label>
                </div>
                <button type="submit" class="btn btn-primary btn-primary-custom">Sign In</button>
            </form>

            <div class="login-footer">
                <p><a href="#">Forgot your password?</a></p>
                <p>Don't have an account? <a href="#">Register here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
