<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - VRAFM System</title>


    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/login.css">

</head>


<body>

    <!-- Hidden Checkbox for CSS-Only Theme Toggle -->
    <input
        type="checkbox"
        id="theme-toggle">


    <!-- ================= LOGIN CONTAINER ================= -->

    <div class="login-container">


        <!-- Theme Toggle -->
        <div class="theme-toggle-wrapper">

            <label
                for="theme-toggle"
                class="theme-toggle-label"
                title="Toggle Light/Dark Mode">
            </label>

        </div>


        <!-- ================= LOGIN CARD ================= -->

        <div class="login-card">


            <!-- Login Header -->
            <div class="login-header">

                <h1>
                    VRAFM
                </h1>

                <p>
                    Welcome back! Please login to your account.
                </p>

            </div>


            <!-- ================= LOGIN FORM ================= -->

            <form
                action="index.html"
                method="GET">


                <!-- Email -->
                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label form-label-custom">

                        Email address

                    </label>


                    <input
                        type="email"
                        class="form-control form-control-custom"
                        id="email"
                        name="email"
                        placeholder="name@example.com"
                        required>

                </div>


                <!-- Password -->
                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label form-label-custom">

                        Password

                    </label>


                    <input
                        type="password"
                        class="form-control form-control-custom"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <!-- Remember Me -->
                <div class="mb-3 form-check">

                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="rememberMe"
                        name="rememberMe">


                    <label
                        class="form-check-label form-label-custom"
                        for="rememberMe">

                        Remember me

                    </label>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="btn btn-primary btn-primary-custom">

                    Sign In

                </button>

            </form>


            <!-- ================= LOGIN FOOTER ================= -->

            <div class="login-footer">

                <p>

                    <a href="#">
                        Forgot your password?
                    </a>

                </p>


                <p>

                    Don't have an account?

                    <a href="register.html">
                        Register here
                    </a>

                </p>

            </div>

        </div>

    </div>

</body>

</html>
